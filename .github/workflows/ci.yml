name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.9.0) from the selected branch"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  core-linux:
    name: SSMTCore tests (Linux, portable FFT)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test -c release --package-path Packages/SSMTCore

  macos:
    name: macOS build + tests (Accelerate, universal app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Localization catalog is complete
        run: python3 scripts/strings.py check
      - name: SSMTCore tests (Accelerate backend)
        run: swift test -c release --package-path Packages/SSMTCore
      - name: SSMTAudio build
        run: swift build --package-path Packages/SSMTAudio
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build universal app
        run: |
          mkdir -p build
          set +e
          xcodebuild -project SSMT.xcodeproj -scheme SSMT -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            build > build/xcodebuild.log 2>&1
          status=$?
          set -e
          grep -E "(error|warning):" build/xcodebuild.log | sort -u | head -200 || true
          if [ $status -ne 0 ]; then tail -150 build/xcodebuild.log; exit $status; fi
          lipo -info build/DerivedData/Build/Products/Release/SSMT.app/Contents/MacOS/SSMT
      - name: Check bundle contents (assets, localizations)
        run: |
          R=build/DerivedData/Build/Products/Release/SSMT.app/Contents/Resources
          ls "$R"
          test -f "$R/Assets.car"
          test -f "$R/AppIcon.icns"
          test -d "$R/ru.lproj" && test -d "$R/en.lproj"
      - name: Snapshot tests (screens + mini window)
        run: |
          set +e
          xcodebuild test -project SSMT.xcodeproj -scheme SSMT -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/TestData \
            CODE_SIGN_IDENTITY="-" > build/snapshot-tests.log 2>&1
          status=$?
          set -e
          grep -E "Test Case|error:|recorded|failed" build/snapshot-tests.log | tail -60 || true
          ls -la build/snapshots || true
          if [ $status -ne 0 ]; then tail -120 build/snapshot-tests.log; exit $status; fi
      - name: Record missing snapshot references
        if: github.event_name == 'push'
        run: |
          REF=App/Tests/Snapshots/References
          mkdir -p "$REF"
          added=0
          for f in build/snapshots/*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            if [ ! -f "$REF/$n" ]; then cp "$f" "$REF/$n"; added=1; fi
          done
          if [ "$added" = 1 ]; then
            git config user.name "ssmt-ci"
            git config user.email "ssmt-ci@users.noreply.github.com"
            git add "$REF"
            git commit -m "CI: record snapshot references [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SSMT-snapshots
          path: build/snapshots
          retention-days: 14
      - name: Sign (ad-hoc) and build the installer package
        run: |
          APP=build/DerivedData/Build/Products/Release/SSMT.app
          # Whole-bundle ad-hoc signature: without a sealed bundle a downloaded app is reported as "damaged".
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p build/pkgroot/Applications
          ditto "$APP" build/pkgroot/Applications/SSMT.app
          pkgbuild --analyze --root build/pkgroot build/components.plist
          plutil -replace 0.BundleIsRelocatable -bool NO build/components.plist
          pkgbuild --root build/pkgroot --component-plist build/components.plist \
            --identifier com.soundsolutions.ssmt --version "$VERSION" --install-location / \
            build/SSMT-component.pkg
          productbuild --package build/SSMT-component.pkg \
            --identifier com.soundsolutions.ssmt.installer --version "$VERSION" \
            "build/SSMT-$VERSION.pkg"
          pkgutil --payload-files "build/SSMT-$VERSION.pkg" | head -5
          (cd build/DerivedData/Build/Products/Release && ditto -c -k --keepParent SSMT.app SSMT-app.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: SSMT-installer
          path: build/SSMT-${{ env.VERSION }}.pkg
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: SSMT-app
          path: build/DerivedData/Build/Products/Release/SSMT-app.zip
          retention-days: 14
      - name: Publish GitHub Release (tags v*, or manual run with release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in v[0-9]*) ;; *) echo "Bad release tag: $TAG"; exit 1;; esac
          # A tag with a suffix (v1.3.0-beta.1) is published as a pre-release.
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac
          gh release create "$TAG" "build/SSMT-${VERSION}.pkg" --target "$GITHUB_SHA" $PRE \
            --title "SSMT $TAG" --notes-file docs/RELEASE_NOTES.md
