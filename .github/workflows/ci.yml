name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.9.0) from the selected branch"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  core-linux:
    name: SSMTCore tests + engine (Linux, portable FFT)
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test -c release --package-path Packages/SSMTCore
      - name: Windows engine from the same sources
        run: swift build -c release --package-path Windows/Engine
      - name: Engine smoke test (simulator, learning, read-only link to a fake X32)
        run: |
          apt-get update -qq && apt-get install -y -qq nodejs > /dev/null
          node Windows/App/scripts/engine-smoke.js "$(swift build -c release --package-path Windows/Engine --show-bin-path)/ssmt-engine"
      - name: Keep the Linux engine for the parity check (Swift runtime linked in, it runs outside this container)
        run: |
          swift build -c release --package-path Windows/Engine --static-swift-stdlib --scratch-path .build-static
          cp "$(swift build -c release --package-path Windows/Engine --static-swift-stdlib --scratch-path .build-static --show-bin-path)/ssmt-engine" ssmt-engine-linux
      - uses: actions/upload-artifact@v4
        with:
          name: ssmt-engine-linux
          path: ssmt-engine-linux

  parity:
    name: Windows interface vs the Mac app, screen by screen
    needs: core-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: ssmt-engine-linux
      - name: Interface assets and Chromium
        working-directory: Windows/App
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          node scripts/assets.js --check
          npx playwright-core install --with-deps chromium
      - name: Draw every Mac screen in the Windows interface
        run: |
          chmod +x ssmt-engine-linux
          node Windows/App/scripts/parity.js ./ssmt-engine-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SSMT-parity
          path: build/parity

  windows:
    name: Windows app (engine + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          # 6.0 cannot build the ucrt module of the runner's Windows SDK 10.0.26100 (cyclic module dependency).
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Build the engine (SSMTCore for Windows)
        run: swift build -c release --package-path Windows/Engine
      - name: Collect the engine with the Swift and MSVC runtimes
        shell: pwsh
        run: |
          $bin = (swift build -c release --package-path Windows/Engine --show-bin-path | Select-Object -Last 1).Trim()
          $dest = "Windows/App/engine"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$bin/ssmt-engine.exe" $dest
          $core = (Get-Command swiftCore.dll -ErrorAction SilentlyContinue | Select-Object -First 1).Source
          if (-not $core) {
            $core = (Get-ChildItem -Path "C:\Program Files\Swift", "$env:LOCALAPPDATA\Programs\Swift" -Recurse -Filter swiftCore.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Runtimes' } | Select-Object -First 1).FullName
          }
          if (-not $core) { throw "Swift runtime (swiftCore.dll) not found" }
          $rt = Split-Path $core
          Write-Host "Swift runtime: $rt"
          Copy-Item "$rt\*.dll" $dest
          # App-local Visual C++ runtime, for computers without the redistributable.
          foreach ($d in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            $p = Join-Path "$env:SystemRoot\System32" $d
            if (Test-Path $p) { Copy-Item $p $dest }
          }
          Get-ChildItem $dest | Format-Table Name, Length
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Interface tests
        working-directory: Windows/App
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Engine smoke test with only the bundled runtime on PATH
        shell: pwsh
        working-directory: Windows/App
        run: |
          $node = (Get-Command node).Source
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & $node scripts/engine-smoke.js engine/ssmt-engine.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the installer
        working-directory: Windows/App
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SSMT-Windows
          path: Windows/App/dist/SSMT-Setup-*.exe
          retention-days: 30

  macos:
    name: macOS build + tests (Accelerate, universal app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Localization catalog is complete
        run: python3 scripts/strings.py check
      - name: SSMTCore tests (Accelerate backend)
        run: swift test -c release --package-path Packages/SSMTCore
      - name: SSMTAudio build
        run: swift build --package-path Packages/SSMTAudio
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build universal app
        run: |
          mkdir -p build
          set +e
          xcodebuild -project SSMT.xcodeproj -scheme SSMT -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            build > build/xcodebuild.log 2>&1
          status=$?
          set -e
          grep -E "(error|warning):" build/xcodebuild.log | sort -u | head -200 || true
          if [ $status -ne 0 ]; then tail -150 build/xcodebuild.log; exit $status; fi
          lipo -info build/DerivedData/Build/Products/Release/SSMT.app/Contents/MacOS/SSMT
      - name: Check bundle contents (assets, localizations)
        run: |
          R=build/DerivedData/Build/Products/Release/SSMT.app/Contents/Resources
          ls "$R"
          test -f "$R/Assets.car"
          test -f "$R/AppIcon.icns"
          test -d "$R/ru.lproj" && test -d "$R/en.lproj"
      - name: Snapshot tests (screens + mini window)
        run: |
          set +e
          xcodebuild test -project SSMT.xcodeproj -scheme SSMT -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/TestData \
            CODE_SIGN_IDENTITY="-" > build/snapshot-tests.log 2>&1
          status=$?
          set -e
          grep -E "Test Case|error:|recorded|failed" build/snapshot-tests.log | tail -60 || true
          ls -la build/snapshots || true
          if [ $status -ne 0 ]; then tail -120 build/snapshot-tests.log; exit $status; fi
      - name: Record missing snapshot references
        if: github.event_name == 'push'
        run: |
          REF=App/Tests/Snapshots/References
          mkdir -p "$REF"
          added=0
          for f in build/snapshots/*.png; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            if [ ! -f "$REF/$n" ]; then cp "$f" "$REF/$n"; added=1; fi
          done
          if [ "$added" = 1 ]; then
            git config user.name "ssmt-ci"
            git config user.email "ssmt-ci@users.noreply.github.com"
            git add "$REF"
            git commit -m "CI: record snapshot references [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SSMT-snapshots
          path: build/snapshots
          retention-days: 14
      - name: Sign (ad-hoc) and build the installer package
        run: |
          APP=build/DerivedData/Build/Products/Release/SSMT.app
          # Whole-bundle ad-hoc signature: without a sealed bundle a downloaded app is reported as "damaged".
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p build/pkgroot/Applications
          ditto "$APP" build/pkgroot/Applications/SSMT.app
          pkgbuild --analyze --root build/pkgroot build/components.plist
          plutil -replace 0.BundleIsRelocatable -bool NO build/components.plist
          pkgbuild --root build/pkgroot --component-plist build/components.plist \
            --identifier com.soundsolutions.ssmt --version "$VERSION" --install-location / \
            build/SSMT-component.pkg
          productbuild --package build/SSMT-component.pkg \
            --identifier com.soundsolutions.ssmt.installer --version "$VERSION" \
            "build/SSMT-$VERSION.pkg"
          pkgutil --payload-files "build/SSMT-$VERSION.pkg" | head -5
          (cd build/DerivedData/Build/Products/Release && ditto -c -k --keepParent SSMT.app SSMT-app.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: SSMT-installer
          path: build/SSMT-${{ env.VERSION }}.pkg
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: SSMT-app
          path: build/DerivedData/Build/Products/Release/SSMT-app.zip
          retention-days: 14

  release:
    name: Publish GitHub Release (macOS + Windows)
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SSMT-installer
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: SSMT-Windows
          path: release
      - name: Publish (tags v*, or manual run with release_tag)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in v[0-9]*) ;; *) echo "Bad release tag: $TAG"; exit 1;; esac
          # A tag with a suffix (v1.3.0-beta.1) is published as a pre-release.
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac
          ls -la release
          gh release create "$TAG" release/SSMT-*.pkg release/SSMT-Setup-*.exe --target "$GITHUB_SHA" $PRE \
            --title "SSMT $TAG" --notes-file docs/RELEASE_NOTES.md
